# The medallion hops, as actually built by tests/fixtures/snowflake_seed.sql.
# The dedup contract here is READ from the fixture's real QUALIFY clause, not invented.
layers:
  bronze: {database: DPHM_TEST, schema: BRONZE}
  silver: {database: DPHM_TEST, schema: SILVER}
  gold: {database: DPHM_TEST, schema: GOLD}

hops:
  # L2: the dedup contract. The pick rule below is exactly the QUALIFY ROW_NUMBER()
  # in the fixture's silver build — two ordering terms, the second a tiebreaker.
  - id: l2_customers
    hop: bronze_to_silver
    lane: A
    source: DPHM_TEST.BRONZE.CUSTOMERS
    target: DPHM_TEST.SILVER.CUSTOMERS
    relation: dedup_of
    dedup:
      key: [CUSTOMER_ID]
      # Confirmed against the actual QUALIFY clause in the fixture transform,
      # not against a model's assertion (07B §6.3).
      key_confirmed_by: "aparandkar@accelerize360.com"
      key_confirmed_at: "2026-09-07T12:45:00Z"
      pick_rule:
        order_by:
          - {column: SOURCE_UPDATED_AT, direction: desc, nulls: last}
          - {column: SOURCE_ROW_ID, direction: desc, nulls: last}
        must_be_total: true
      compare_columns: business
    declared_losses:
      - {name: dedup_collapse, kind: dedup}
      - name: rejected
        kind: reject_table
        table: DPHM_TEST.SILVER.CUSTOMERS_REJECT
        reason_column: REJECT_REASON
        allowed_reasons: [NULL_BUSINESS_KEY, CAST_FAILED, FAILED_DOMAIN_RULE]
      - {name: filtered_test_accounts, kind: filter, predicate: "IS_TEST = true"}
    strict_conservation: true

  # NOT dedup_of. Bronze has no duplicate ORDER_IDs, so nothing is deduplicated here —
  # this hop only drops test orders. Declaring it dedup_of would generate nine dedup
  # checks that find nothing and report green forever, which is the precise failure mode
  # the product exists to prevent.
  - id: l2_orders
    hop: bronze_to_silver
    lane: A
    source: DPHM_TEST.BRONZE.ORDERS
    target: DPHM_TEST.SILVER.ORDERS
    relation: conserved
    key: [ORDER_ID]
    declared_losses:
      - {name: filtered_test_orders, kind: filter, predicate: "IS_TEST = true"}
    strict_conservation: true

  # The dimension is built from the change HISTORY in bronze, not from silver's current
  # state — a standard SCD2 pattern. Silver answers "what is true now"; the dimension
  # answers "what was true then", and it needs every version to do that.
  - id: l3_dim_customer
    hop: silver_to_gold
    lane: A
    source: DPHM_TEST.BRONZE.CUSTOMERS
    target: DPHM_TEST.GOLD.DIM_CUSTOMER
    relation: scd2_of
    key: [CUSTOMER_ID]

  - id: l3_fct_order
    hop: silver_to_gold
    lane: A
    source: DPHM_TEST.SILVER.ORDERS
    target: DPHM_TEST.GOLD.FCT_ORDER
    relation: conserved
    key: [ORDER_ID]
    fanout_max: 1
    measures:
      - {column: AMOUNT, source_column: AMOUNT, additive: true, tolerance: {abs: 0.01}}

  - id: l3_mart_daily_revenue
    hop: silver_to_gold
    lane: A
    source: DPHM_TEST.SILVER.ORDERS
    target: DPHM_TEST.GOLD.MART_DAILY_REVENUE
    relation: aggregate_of
    group_by: [ORDER_DATE, COUNTRY]
    group_by_confirmed_by: "aparandkar@accelerize360.com"
    measures:
      - {column: REVENUE, expr: "sum(AMOUNT)", additive: true, tolerance: {abs: 0.01}}
      - {column: ORDER_COUNT, expr: "count(*)", additive: true}
      - {column: AVG_BASKET, expr: "avg(AMOUNT)", additive: false}
      - {column: UNIQUE_BUYERS, expr: "count(distinct CUSTOMER_ID)", additive: false}

  # MART_CHURN has no silver source, so it gets NO hop and NO checks — it appears in
  # coverage as unvalidated. That absence is the honest report, not an oversight.
