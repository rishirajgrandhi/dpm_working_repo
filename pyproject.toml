[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dphm"
version = "0.1.0"
description = "Data Pipeline Health Monitor — RDS -> Snowflake migration monitoring"
requires-python = ">=3.11"
dependencies = [
  # config is the product; validated at load (04 §3)
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  # the only public interface
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  # SSO; no local accounts
  "authlib>=1.3",
  "itsdangerous>=2.2",
  # in-service cadence; no crontab to maintain
  "apscheduler>=3.10",
  # native drivers, no ORM
  "snowflake-connector-python>=3.10",
  "psycopg[binary]>=3.1",
  # dialect-aware parsing; templates read like reviewable SQL
  "sqlglot>=25.0",
  "jinja2>=3.1",
  "GitPython>=3.1",
  "httpx>=0.27",
  "structlog>=24.1",
]

[project.optional-dependencies]
agents = [
  # PINNED EXACTLY. 04 §3: the fastest-moving dependency and the furthest from the
  # product's guarantees. Upgraded deliberately, in its own PR, gated by tests/agents.
  "langgraph==0.2.28",
  "langchain-core==0.3.9",
  "langchain-anthropic==0.2.3",
]
reporting = ["slack-sdk>=3.27"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-snapshot>=0.9",
  # A real PostgreSQL server bundled as a wheel — no Docker daemon, no Homebrew.
  # Without this the 34 integration tests SKIP silently, so a fresh clone appears to
  # pass while never touching a database. Found by cloning the repo and running the
  # documented setup.
  "pgserver>=0.1.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-PyYAML",
]

# ── Maintenance entrypoints only. There is NO user-facing CLI (02 D4, 12 §8). ──
# Humans use the web app; machines call signed webhooks or the internal scheduler.
[project.scripts]
dphm-migrate = "dphm.state.migrate:main"
dphm-sweep-scratch = "dphm.state.sweeper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dphm"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "PTH", "RUF", "S"]
ignore = [
  "S101",  # assert: used deliberately in tests and in internal invariants
  "A003",  # builtin-shadowing attribute names are unavoidable in warehouse metadata models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]                 # test fixtures carry fake secrets on purpose
"src/dphm/config/loader.py" = ["S105"]       # the secret-literal scanner names patterns inline
# These modules GENERATE SQL — that is their purpose. S608 (SQL built by string
# composition) is therefore expected rather than a finding. Safety comes from elsewhere:
# identifiers are validated against a strict pattern before interpolation (SQL
# identifiers cannot be bind parameters), templates are reviewed and snapshot-tested,
# and warehouse/safety.py guards every statement before execution.
"src/dphm/engine/scope.py" = ["S608"]
# S701: autoescape is for HTML. These templates emit SQL, where HTML escaping would
# corrupt it. Injection is prevented by validating identifiers before they are passed in
# and by StrictUndefined making a missing parameter an error rather than an empty string.
"src/dphm/engine/render.py" = ["S608", "S701"]
"src/dphm/engine/execute.py" = ["S608"]
"src/dphm/engine/expand.py" = ["S608"]
"src/dphm/state/repo.py" = ["S608"]
# FastAPI resolves dependency annotations at RUNTIME, so the TCH rules' advice to move
# them into a type-checking block would break injection. Disabled for the API layer only.
"src/dphm/api/**" = ["TC001", "TC002", "TC003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["dphm"]

[[tool.mypy.overrides]]
# Native drivers ship no usable stubs. Confined to the adapter modules that wrap them.
module = ["snowflake.*", "psycopg.*", "apscheduler.*", "authlib.*", "git.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs a live Postgres or Snowflake (not run on every commit locally)",
  "mutation: gate 3 — bug injection into DPHM_SCRATCH. BLOCKING in CI (10, 14 §5)",
]

[tool.coverage.report]
# 14 §9. The trust boundary carries the highest bar.
fail_under = 80
